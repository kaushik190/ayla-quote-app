name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev openssl libgdbm-dev liblzma-dev libreadline-dev \
            uuid-dev zip unzip autoconf libtool pkg-config libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip setuptools
          pip install "buildozer==1.5.0" "cython==0.29.33"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          yes | buildozer -v android debug --output-dir=bin

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductQuoteApp-APK
          path: bin/*.apk
